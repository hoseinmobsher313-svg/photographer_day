<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050608">
  <title>Happy World Photographer's Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="rain"></div>
  <div class="watercolor watercolor-top"></div>
  <div class="watercolor watercolor-bottom"></div>

  <main class="stage" id="stage">
    <div class="camera-bg"></div>
    <div class="shade"></div>

    <header class="hero">
      <p class="eyebrow">HTML · CSS · JS</p>
      <h1>
        <span class="drop">Happy</span>
        <span class="drop emoji">😊</span>
        <span class="drop">World</span>
        <span class="drop emoji">🌍</span>
      </h1>
      <h2 class="photographer">Photographer's Day</h2>
      <p class="date">August 19 <span>😍</span></p>
    </header>

    <section class="camera-card" id="cameraCard" aria-label="Camera panel">
      <div class="camera-image"></div>
      <div class="camera-copy">
        <span>SONY · CAMERA & FILM</span>
        <strong>Capture the light.</strong>
        <small>Happy World Photographer's Day</small>
      </div>
    </section>

    <div class="flashlight-wrap" aria-label="Flashlight controls">
      <div class="glow" id="glow"></div>
      <button class="flashlight" id="flashlight" type="button" aria-pressed="false">
        <span class="bulb">●</span>
        <span class="flash-label">FLASHLIGHT</span>
      </button>
      <input id="brightness" class="brightness" type="range" min="0" max="100" value="35" aria-label="Light intensity">
    </div>

    <button class="bell" id="bell" type="button" aria-label="Open camera">
      🔔
      <span class="bell-tip">Drag down</span>
    </button>

    <section class="download-panel">
      <div>
        <b>Download animation</b>
        <span>1080p · 4K · 8K*</span>
      </div>
      <select id="quality">
        <option value="1080">1080p</option>
        <option value="2160">4K</option>
        <option value="4320">8K</option>
      </select>
      <button id="downloadBtn" type="button">Download WebM</button>
      <button id="shareBtn" type="button" class="ghost">Share / Copy link</button>
      <small>*8K export depends on browser/device memory and is an upscale of the supplied image.</small>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
