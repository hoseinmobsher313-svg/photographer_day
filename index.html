<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<meta name="description" content="Happy World Photographer's Day — interactive cinematic animated wallpaper.">
<title>Happy World Photographer's Day — August 19</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" class="scene is-on">
  <canvas id="paint" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Faint cinematic camera-back silhouettes -->
  <div class="camera-wall" aria-hidden="true">
    <span class="ghost-camera g1"></span>
    <span class="ghost-camera g2"></span>
    <span class="ghost-camera g3"></span>
    <span class="ghost-camera g4"></span>
  </div>

  <section class="hero" aria-label="World Photographer's Day">
    <p class="eyebrow">A CINEMATIC TRIBUTE TO THE ART OF SEEING</p>
    <h1>
      <span class="word">Happy</span>
      <span class="word world-word">World <b>🌍</b></span>
      <span class="word photographer-word">Photographer</span>
    </h1>
    <div class="spark-line" aria-hidden="true"><i>✦</i><i>·</i><i>✧</i><i>·</i><i>✦</i></div>
    <p class="subtitle">Happy World Photographer's Day</p>
    <p class="date">AUGUST <strong>19</strong></p>
  </section>

  <div class="lamp" aria-hidden="true">
    <div class="lamp-cable"></div>
    <div class="lamp-cap"></div>
    <div class="lamp-shade"></div>
    <div class="lamp-bulb"></div>
    <div class="lamp-glow"></div>
  </div>

  <section class="camera-stage" aria-label="Camera">
    <div class="camera-aura"></div>
    <img id="camera" src="camera.png" alt="Camera">
    <div class="camera-reflection"></div>
  </section>

  <div class="ink-splash" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Draggable light switch -->
  <button id="lightControl" class="light-control" aria-label="Drag or click to turn the light on or off" aria-pressed="true">
    <span class="control-label">LIGHT</span>
    <span class="control-rail"><span class="control-fill"></span><span class="control-knob">☼</span></span>
    <span class="control-state">ON</span>
  </button>

  <footer class="footer">
    <span>SEE THE MOMENT.</span>
    <span>FEEL THE LIGHT.</span>
    <span class="smile">😍</span>
  </footer>

  <aside class="download-panel" aria-label="Wallpaper export">
    <div class="panel-title">WALLPAPER EXPORT</div>
    <div class="export-row">
      <label for="resolution">QUALITY</label>
      <select id="resolution">
        <option value="1920x1080">1080p — Full HD</option>
        <option value="2560x1440">1440p — QHD</option>
        <option value="3840x2160">4K — UHD</option>
        <option value="7680x4320">8K — UHD</option>
      </select>
    </div>
    <div class="export-row">
      <label for="duration">LOOP</label>
      <select id="duration">
        <option value="8">8 seconds</option>
        <option value="12" selected>12 seconds</option>
        <option value="16">16 seconds</option>
      </select>
    </div>
    <div class="buttons">
      <button id="downloadBtn" class="primary">DOWNLOAD ANIMATED WALLPAPER</button>
      <button id="shareBtn">SHARE PAGE</button>
    </div>
    <div id="progressWrap" class="progress-wrap" hidden>
      <div class="progress"><span id="progress"></span></div>
      <small id="progressText">Preparing…</small>
    </div>
    <small class="hint">WebM export uses your browser's native recorder. 8K may require a modern desktop browser.</small>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>

<script src="app.js"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
